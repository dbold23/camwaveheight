[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "camwaveheight"
version = "0.0.1"
description = "Webcam-based wave height inference, validated against CDIP nearshore buoys"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Daniel Sambold", email = "dsambold@csumb.edu" }]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "pyarrow>=15",
    "opencv-python>=4.9",
    "matplotlib>=3.8",
    "pyyaml>=6",
    "pydantic>=2.6",
    "erddapy>=2.2",
    "requests>=2.31",
    "click>=8.1",
]

[project.optional-dependencies]
ml = [
    "torch>=2.2",
    "ultralytics>=8.1",
    "segmentation-models-pytorch>=0.3",
]
dashboard = [
    "streamlit>=1.32",
]
# Satellite data stream (sibling to the cam pipeline). Split so the finicky
# GDAL-backed shoreline stack stays opt-in.
sat-waves = [
    "copernicusmarine>=1.3",
    "xarray>=2024.1",
    "netcdf4>=1.6",
]
sat-shoreline = [
    "earthengine-api>=0.1.390",
    "geemap>=0.32",
    "geopandas>=0.14",
    "shapely>=2.0",
    "scikit-image>=0.22",
]
sat-env = [
    "pystac-client>=0.7",
    "odc-stac>=0.3",
    "rioxarray>=0.15",
    "requests>=2.31",
]
sat-all = [
    "camwaveheight[sat-waves,sat-shoreline,sat-env]",
]
dev = [
    "pytest>=8",
    "ruff>=0.3",
    "ipykernel>=6.29",
    # tests/test_waves_cache.py writes a tiny .nc and reads it back, so the
    # netCDF stack is needed to run the suite without the copernicusmarine dep.
    "xarray>=2024.1",
    "netcdf4>=1.6",
]

[project.scripts]
cwh = "camwaveheight.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/camwaveheight"]

[tool.ruff]
line-length = 100
target-version = "py311"
