[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "camwaveheight"
version = "0.0.1"
description = "Webcam-based wave height inference, validated against CDIP nearshore buoys"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Daniel Sambold", email = "dsambold@csumb.edu" }]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "pyarrow>=15",
    "opencv-python>=4.9",
    "matplotlib>=3.8",
    "pyyaml>=6",
    "pydantic>=2.6",
    "erddapy>=2.2",
    "requests>=2.31",
    "click>=8.1",
]

[project.optional-dependencies]
ml = [
    "torch>=2.2",
    "ultralytics>=8.1",
    "segmentation-models-pytorch>=0.3",
]
dashboard = [
    "streamlit>=1.32",
]
dev = [
    "pytest>=8",
    "ruff>=0.3",
    "ipykernel>=6.29",
]

[project.scripts]
cwh = "camwaveheight.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/camwaveheight"]

[tool.ruff]
line-length = 100
target-version = "py311"
